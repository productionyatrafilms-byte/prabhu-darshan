<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title-1"></title>


  <link rel="stylesheet" href="./assets/css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />

    <style>
      .page-title span {
        font-size: 4vw !important;
      }
    </style>
  </head>

  <body>
    <a class="home-button home-btn" href="index.html">
      <img src="./assets/images/home-btn.png" alt="" />
    </a>

    <div class="page-title">
      <span data-lang-key="title-1"></span>
    </div>

    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>

    <main>
      <div class="home-container">
        <div class="left-home-container">
          <div class="image-swiper-border">
            <div class="image-swiper swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <video src="./assets/videos/1-1.mp4" muted loop playsinline></video>
                </div>

                <div class="swiper-slide">
                  <video src="./assets/videos/1-2.mp4" muted loop playsinline></video>
                </div>

                <div class="swiper-slide">
                  <video src="./assets/videos/1-3.mp4" muted loop playsinline></video>
                </div>

                <div class="swiper-slide">
                  <video src="./assets/videos/1-4.mp4" muted loop playsinline></video>
                </div>

                <div class="swiper-slide">
                  <video src="./assets/videos/1-5.mp4" muted loop playsinline></video>
                </div>
              </div>
            </div>
          </div>

          <div class="custom-nav">
            <button class="custom-prev hidden">
              <img src="./assets/images/prev-btn.png" alt="" />
            </button>

            <button class="custom-next">
              <img src="./assets/images/next-btn.png" alt="" />
            </button>
          </div>
        </div>

        <div class="right-home-container">
          <div class="design design-1">
            <img src="./assets/images/Group 9.png" alt="" />
          </div>

          <div class="text-swiper swiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <div class="text-box">
                  <p data-lang-key="slide-1.1"></p>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="text-box">
                  <p data-lang-key="slide-1.2"></p>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="text-box">
                  <p data-lang-key="slide-1.3"></p>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="text-box">
                  <p data-lang-key="slide-1.4"></p>
                </div>
              </div>

              <div class="swiper-slide">
                <div class="text-box">
                  <p data-lang-key="slide-1.5"></p>
                </div>
              </div>
            </div>
          </div>

          <div class="design design-1">
            <img src="./assets/images/Group 8.png" alt="" />
          </div>

          <div class="pages">
            <a
              href="what-to-do.html"
              class="page page-1"
              data-lang-key="num-1"
            ></a>

            <a
              href="what-not-to-do.html"
              class="page page-2"
              data-lang-key="num-2"
            ></a>
          </div>
        </div>
      </div>
    </main>



    <!-- Audios -->
    <audio id="homeAudio" src="./assets/audio/pop.mp3" preload="auto"></audio>
    <audio id="pageAudio" src="./assets/audio/8.mp3" preload="auto"></audio>
    <audio id="swipeAudio" src="./assets/audio/swipe.mp3" preload="auto"></audio>

    <audio id="engAudio" src="./assets/audio/Eng.mpeg" preload="auto"></audio>
    <audio id="hinAudio" src="./assets/audio/Hin.mpeg" preload="auto"></audio>
    <audio id="gujAudio" src="./assets/audio/Guj.mpeg" preload="auto"></audio>

    <script src="./assets/js/swiper-bundle.min.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/swiper.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const homeBtn = document.querySelector(".home-btn");

        const englishBtn = document.querySelector(".english");
        const hindiBtn = document.querySelector(".hindi");
        const gujratiBtn = document.querySelector(".gujrati");

        const pageBtns = document.querySelectorAll(".page");
        const prevBtn = document.querySelector(".custom-prev");
        const nextBtn = document.querySelector(".custom-next");

        const homeAudio = document.getElementById("homeAudio");
        const pageAudio = document.getElementById("pageAudio");
        const swipeAudio = document.getElementById("swipeAudio");

        const engAudio = document.getElementById("engAudio");
        const hinAudio = document.getElementById("hinAudio");
        const gujAudio = document.getElementById("gujAudio");

        function stopAllAudio() {
          const audios = [
            homeAudio,
            pageAudio,
            swipeAudio,
            engAudio,
            hinAudio,
            gujAudio,
          ];

          audios.forEach((audio) => {
            if (audio) {
              audio.pause();
              audio.currentTime = 0;
            }
          });
        }

        function playAudio(audio) {
          if (!audio) return;

          stopAllAudio();

          audio.currentTime = 0;

          const playPromise = audio.play();

          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.log("Audio not playing. Check file path or browser:", error);
            });
          }
        }

        homeBtn?.addEventListener("click", function (e) {
          e.preventDefault();

          playAudio(homeAudio);

          setTimeout(() => {
            window.location.href = this.href;
          }, 500);
        });

        pageBtns.forEach((pageBtn) => {
          pageBtn.addEventListener("click", function (e) {
            e.preventDefault();

            playAudio(pageAudio);

            setTimeout(() => {
              window.location.href = this.href;
            }, 600);
          });
        });

        prevBtn?.addEventListener("click", () => {
          playAudio(swipeAudio);
        });

        nextBtn?.addEventListener("click", () => {
          playAudio(swipeAudio);
        });

        englishBtn?.addEventListener("click", () => {
          playAudio(engAudio);
        });

        hindiBtn?.addEventListener("click", () => {
          playAudio(hinAudio);
        });

        gujratiBtn?.addEventListener("click", () => {
          playAudio(gujAudio);
        });

        // ---- Play video only for the currently visible/active slide ----
        // Note: the image-swiper instance itself is initialized in an
        // external script (app.js / swiper.js), so this logic works purely
        // off the DOM (the "swiper-slide-active" class Swiper applies) plus
        // an IntersectionObserver, rather than a local Swiper reference.

        const imageSlides = document.querySelectorAll(".image-swiper .swiper-slide");
        const imageWrapper = document.querySelector(".image-swiper .swiper-wrapper");

        function isSlideInViewport(slide) {
          const rect = slide.getBoundingClientRect();
          return (
            rect.bottom > 0 &&
            rect.right > 0 &&
            rect.top < (window.innerHeight || document.documentElement.clientHeight) &&
            rect.left < (window.innerWidth || document.documentElement.clientWidth)
          );
        }

        function updateVideoPlayback() {
          imageSlides.forEach((slide) => {
            const video = slide.querySelector("video");
            if (!video) return;

            const isActiveSlide = slide.classList.contains("swiper-slide-active");
            const isVisible = isActiveSlide && isSlideInViewport(slide);

            if (isVisible) {
              if (video.paused) {
                const playPromise = video.play();
                if (playPromise !== undefined) {
                  playPromise.catch((error) => {
                    console.log("Video not playing. Check file path or browser:", error);
                  });
                }
              }
            } else {
              if (!video.paused) {
                video.pause();
              }
              video.currentTime = 0;
            }
          });
        }

        // Re-check whenever Swiper toggles the active-slide class
        if (imageWrapper) {
          const slideClassObserver = new MutationObserver(() => {
            updateVideoPlayback();
          });

          imageSlides.forEach((slide) => {
            slideClassObserver.observe(slide, {
              attributes: true,
              attributeFilter: ["class"],
            });
          });
        }

        // Re-check on scroll/resize in case the swiper scrolls out of view
        window.addEventListener("scroll", updateVideoPlayback, { passive: true });
        window.addEventListener("resize", updateVideoPlayback);

        // Extra safety net: IntersectionObserver per video
        const videoVisibilityObserver = new IntersectionObserver(
          () => {
            updateVideoPlayback();
          },
          { threshold: 0.25 }
        );

        imageSlides.forEach((slide) => {
          const video = slide.querySelector("video");
          if (video) {
            videoVisibilityObserver.observe(video);
          }
        });

        // Run once on load for the initial active slide
        updateVideoPlayback();
        // ---- End video visibility control ----
      });
    </script>
  </body>
</html>
